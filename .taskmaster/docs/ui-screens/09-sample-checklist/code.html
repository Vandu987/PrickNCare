<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Prick &amp; Care - Sample Checklist</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1b4e88",
                        "brand-teal": "#14b8a6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#121920",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .iphone-15-pro {
            width: 393px;
            height: 852px;
            border: 8px solid #2d2d2d;
            border-radius: 55px;
            position: relative;
            overflow: hidden;
            background: #f6f7f8;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .dynamic-island {
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen p-4">
<!-- iPhone 15 Pro Frame -->
<div class="iphone-15-pro bg-background-light dark:bg-background-dark flex flex-col">
<div class="dynamic-island"></div>
<!-- Top Navigation -->
<header class="pt-12 px-6 pb-2 bg-white dark:bg-slate-900 shadow-sm">
<div class="flex items-center justify-between mb-4">
<button class="text-slate-900 dark:text-slate-100 p-1">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<h1 class="text-lg font-bold text-slate-900 dark:text-slate-100">Collect Samples</h1>
<div class="w-8"></div> <!-- Spacer for balance -->
</div>
<!-- Progress Bar Section -->
<div class="space-y-2 mb-4">
<div class="flex justify-between items-center text-xs font-semibold text-slate-500 uppercase tracking-wider">
<span>Collection Progress</span>
<span class="text-primary">Step 2 of 6</span>
</div>
<div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3 transition-all duration-500"></div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto custom-scrollbar px-6 py-6 space-y-6">
<!-- Checklist Section -->
<section>
<h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">Checklist</h3>
<div class="space-y-3">
<!-- Item 1 -->
<label class="flex items-center p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm cursor-pointer group">
<input checked="" class="w-6 h-6 rounded border-slate-300 text-primary focus:ring-primary transition-all mr-4 cursor-pointer" type="checkbox"/>
<div class="flex-1">
<p class="text-slate-900 dark:text-slate-100 font-semibold text-sm">CBC</p>
<p class="text-slate-500 dark:text-slate-400 text-xs flex items-center gap-1.5 mt-0.5">
<span class="size-2 rounded-full bg-purple-500"></span> 1x EDTA tube
                            </p>
</div>
</label>
<!-- Item 2 -->
<label class="flex items-center p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm cursor-pointer group">
<input checked="" class="w-6 h-6 rounded border-slate-300 text-primary focus:ring-primary transition-all mr-4 cursor-pointer" type="checkbox"/>
<div class="flex-1">
<p class="text-slate-900 dark:text-slate-100 font-semibold text-sm">Thyroid Profile</p>
<p class="text-slate-500 dark:text-slate-400 text-xs flex items-center gap-1.5 mt-0.5">
<span class="size-2 rounded-full bg-yellow-400"></span> 1x SST tube
                            </p>
</div>
</label>
<!-- Item 3 -->
<label class="flex items-center p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm cursor-pointer group">
<input checked="" class="w-6 h-6 rounded border-slate-300 text-primary focus:ring-primary transition-all mr-4 cursor-pointer" type="checkbox"/>
<div class="flex-1">
<p class="text-slate-900 dark:text-slate-100 font-semibold text-sm">Vitamin D</p>
<p class="text-slate-500 dark:text-slate-400 text-xs flex items-center gap-1.5 mt-0.5">
<span class="size-2 rounded-full bg-yellow-400"></span> Same SST tube
                            </p>
</div>
</label>
</div>
</section>
<!-- Counter and Toggle Section -->
<section class="grid grid-cols-2 gap-4">
<!-- Tube Counter -->
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm">
<p class="text-xs font-bold text-slate-400 uppercase mb-3">Total Vials</p>
<div class="flex items-center justify-between">
<button class="size-8 rounded-full bg-primary/10 text-primary flex items-center justify-center hover:bg-primary hover:text-white transition-colors">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<span class="text-xl font-bold text-slate-900 dark:text-slate-100">2</span>
<button class="size-8 rounded-full bg-primary/10 text-primary flex items-center justify-center hover:bg-primary hover:text-white transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
<!-- Fasting Toggle -->
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm">
<p class="text-xs font-bold text-slate-400 uppercase mb-3">Fasting?</p>
<div class="flex items-center justify-between">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Yes</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
<!-- Notes Section -->
<section>
<label class="block text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">Collection Notes</label>
<textarea class="w-full bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-primary focus:border-primary shadow-sm" placeholder="Enter any issues or observations (e.g., small veins, patient anxiety)..." rows="3"></textarea>
</section>
</main>
<!-- Bottom Action Bar -->
<footer class="p-6 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 pb-10">
<button class="w-full bg-brand-teal hover:bg-teal-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-teal-500/20 flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
                Next: Photo Documentation
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<div class="mt-4 flex justify-center">
<div class="w-32 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</footer>
</div>
</body></html>

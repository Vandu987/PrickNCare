<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Leave Application - Prick &amp; Care</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecda",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .iphone-frame {
            width: 393px;
            height: 852px;
            border: 12px solid #222;
            border-radius: 55px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
            background: #f6f8f8;
        }
        .dynamic-island {
            width: 120px;
            height: 35px;
            background: #222;
            border-radius: 20px;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }
        /* Custom scrollbar for the mock app container */
        .app-container::-webkit-scrollbar {
            display: none;
        }
        .app-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen p-4">
<!-- iPhone 15 Pro Frame Mockup -->
<div class="iphone-frame bg-background-light dark:bg-background-dark relative">
<div class="dynamic-island"></div>
<!-- App Content Container -->
<div class="app-container h-full w-full overflow-y-auto flex flex-col pt-12">
<!-- TopAppBar -->
<div class="flex items-center px-4 py-3 justify-between sticky top-0 bg-background-light/80 backdrop-blur-md z-40">
<button class="text-slate-900 dark:text-slate-100 p-2 -ml-2 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined block">arrow_back_ios_new</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight flex-1 text-center pr-8">Apply Leave</h2>
</div>
<!-- Form Content -->
<div class="flex-1 px-5 py-2 space-y-5">
<!-- Leave Type Dropdown -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Leave Type</label>
<div class="relative">
<select class="appearance-none w-full rounded-xl border-slate-200 bg-white dark:bg-slate-800 dark:border-slate-700 p-4 pr-10 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm">
<option selected="" value="casual">Casual Leave</option>
<option value="sick">Sick Leave</option>
<option value="earned">Earned Leave</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
</div>
<!-- Date Fields -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">From</label>
<div class="relative">
<input class="w-full rounded-xl border-slate-200 bg-white dark:bg-slate-800 dark:border-slate-700 p-4 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary shadow-sm" readonly="" type="text" value="Oct 24, 2023"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-primary text-xl">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">To</label>
<div class="relative">
<input class="w-full rounded-xl border-slate-200 bg-white dark:bg-slate-800 dark:border-slate-700 p-4 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary shadow-sm" readonly="" type="text" value="Oct 25, 2023"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-primary text-xl">calendar_today</span>
</div>
</div>
</div>
<!-- Days Count Badge -->
<div class="flex items-center">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-primary/20 text-slate-900 dark:text-slate-100 rounded-full border border-primary/30">
<span class="material-symbols-outlined text-sm font-bold">info</span>
<span class="text-sm font-bold tracking-tight">2 days duration</span>
</div>
</div>
<!-- Reason Text Area -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Reason</label>
<textarea class="w-full rounded-xl border-slate-200 bg-white dark:bg-slate-800 dark:border-slate-700 p-4 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary shadow-sm resize-none placeholder:text-slate-400" placeholder="Describe the reason for your leave..." rows="4">Family function in hometown</textarea>
</div>
<!-- Warning Banner -->
<div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl p-4 flex gap-3 items-start">
<span class="material-symbols-outlined text-amber-500 mt-0.5">warning</span>
<p class="text-sm text-amber-800 dark:text-amber-200 leading-snug">
                        Only <span class="font-bold">1 casual leave</span> remaining for this quarter. Plan accordingly.
                    </p>
</div>
</div>
<!-- Footer Actions -->
<div class="p-5 space-y-3 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 pb-10">
<button class="w-full bg-primary hover:bg-primary/90 text-slate-900 font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                    Submit Application
                </button>
<button class="w-full bg-transparent border-2 border-primary/50 text-primary font-bold py-4 rounded-xl hover:bg-primary/5 transition-all">
                    Cancel
                </button>
</div>
</div>
<!-- Navigation Bar Indicator -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full pointer-events-none"></div>
</div>
</body></html>

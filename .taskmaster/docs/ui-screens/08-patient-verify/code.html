<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1b4e88",
                        "teal-accent": "#0d9488",
                        "background-light": "#f6f7f8",
                        "background-dark": "#121920",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Step 1: Patient Verification - Prick &amp; Care</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-200 font-display flex items-center justify-center min-h-screen p-4">
<!-- iPhone 15 Pro Frame Container -->
<div class="relative w-[393px] h-[852px] bg-background-light dark:bg-background-dark rounded-[55px] shadow-2xl overflow-hidden border-[8px] border-slate-800">
<!-- Status Bar Area (Notch Simulation) -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-7 bg-slate-800 rounded-b-3xl z-50"></div>
<!-- Main Content Scroll Area -->
<div class="flex flex-col h-full overflow-y-auto">
<!-- TopAppBar -->
<div class="sticky top-0 z-40 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center p-6 pb-2 justify-between mt-6">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight flex-1 text-center">Verify Patient</h2>
<div class="size-10"></div> <!-- Spacer for balance -->
</div>
<!-- Progress Indicator -->
<div class="flex flex-col gap-2 px-6 py-4">
<div class="flex justify-between items-end">
<p class="text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider">Collection Flow</p>
<p class="text-teal-accent text-sm font-bold">Step 1/6</p>
</div>
<div class="h-2 w-full bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-teal-accent rounded-full" style="width: 16.6%;"></div>
</div>
</div>
</div>
<!-- Main Form Content -->
<div class="flex-1 px-6 space-y-6 pb-24">
<!-- Patient Info Card -->
<div class="flex items-center gap-4 p-4 rounded-xl bg-white dark:bg-slate-900 shadow-sm border border-slate-100 dark:border-slate-800">
<div class="size-16 rounded-lg bg-primary/10 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Portrait of middle aged male patient" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBn7BkNYl8SivsT8O61wUk2w5mEcz58fsVr0LW97vLNFJEJQP-GBhjTIPF0-R2T50CF2YQaI-ZqcGVS4rBW7DV1uSyRqnmg29LPoYaEFU0O0fvXhbt_gcLy11v4XvYwTzlTZChH8bgTwdEg1HkUrwh_faW6Ifn2NDifjkqhB2VyY1hJJkq63j4c1THg3jOOcaaxFI5Zd93HS5rzYCaVs8wlGNJ02gh5XA1cG9H0KTKjUfprD4yiZE2GiqhVBMVElB3tNU9me5pIVUI"/>
</div>
<div class="flex flex-col">
<p class="text-slate-900 dark:text-slate-100 text-base font-bold">Johnathan Doe</p>
<p class="text-slate-500 dark:text-slate-400 text-sm">45 years • Male</p>
<p class="text-slate-400 dark:text-slate-500 text-xs mt-1 italic">Ref: #PC-98234</p>
</div>
</div>
<div class="space-y-4">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-bold uppercase tracking-wide">Verification Methods</h3>
<!-- Send OTP Option -->
<div class="space-y-3">
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-primary text-white font-bold transition-all active:scale-95 shadow-lg shadow-primary/20">
<span class="flex items-center gap-3">
<span class="material-symbols-outlined">smartphone</span>
                                Send OTP to Patient
                            </span>
<span class="material-symbols-outlined">chevron_right</span>
</button>
<!-- OTP Input Fields (Hidden/State Representation) -->
<div class="flex justify-between gap-3 mt-4 px-2">
<input class="size-14 text-center text-2xl font-bold rounded-lg border-2 border-primary bg-primary/5 dark:bg-primary/20 text-slate-900 dark:text-slate-100 focus:ring-0 focus:border-primary" maxlength="1" type="text" value="4"/>
<input class="size-14 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent text-slate-900 dark:text-slate-100 focus:ring-0 focus:border-primary" maxlength="1" type="text"/>
<input class="size-14 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent text-slate-900 dark:text-slate-100 focus:ring-0 focus:border-primary" maxlength="1" type="text"/>
<input class="size-14 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent text-slate-900 dark:text-slate-100 focus:ring-0 focus:border-primary" maxlength="1" type="text"/>
</div>
</div>
<div class="relative py-2">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="bg-background-light dark:bg-background-dark px-2 text-slate-400">OR</span>
</div>
</div>
<!-- Manual Verification Option -->
<div class="space-y-4">
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold border border-slate-200 dark:border-slate-700">
<span class="flex items-center gap-3">
<span class="material-symbols-outlined">badge</span>
                                Verify ID Manually
                            </span>
</button>
<label class="flex items-center gap-3 p-4 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
<div class="relative flex items-center">
<input class="peer size-6 rounded border-slate-300 text-teal-accent focus:ring-teal-accent transition-all cursor-pointer" type="checkbox"/>
<div class="pointer-events-none absolute inset-0 opacity-0 peer-checked:opacity-100 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm font-bold">check</span>
</div>
</div>
<span class="text-sm font-medium text-slate-600 dark:text-slate-400">I verified patient's government-issued ID</span>
</label>
</div>
</div>
<!-- Success State (Conditionally shown in real app) -->
<div class="flex items-center justify-center gap-2 p-4 bg-teal-accent/10 border border-teal-accent/20 rounded-xl">
<span class="material-symbols-outlined text-teal-accent font-bold">check_circle</span>
<span class="text-teal-accent font-bold">Patient Identity Verified</span>
</div>
</div>
<!-- Bottom Navigation -->
<div class="absolute bottom-0 w-full p-6 bg-white dark:bg-slate-950 border-t border-slate-100 dark:border-slate-900">
<button class="w-full h-14 bg-teal-accent text-white rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg shadow-teal-accent/30 active:scale-[0.98] transition-all">
                    Next
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- iOS Home Indicator -->
<div class="mt-4 mx-auto w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</div>
</div>
</body></html>

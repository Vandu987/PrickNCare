<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Prick &amp; Care Splash Screen</title>
<!-- Tailwind CSS with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1b4e88",
                        "brand-navy": "#1B4F8A",
                        "brand-teal": "#2EAE7D",
                        "brand-red": "#E11D48",
                        "background-light": "#f6f7f8",
                        "background-dark": "#121920",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Pulse Effect for Loading Indicator */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 0.8; }
            80%, 100% { transform: scale(1.5); opacity: 0; }
        }
        .pulse-circle::before {
            content: '';
            position: absolute;
            left: -12px;
            top: -12px;
            width: 48px;
            height: 48px;
            border-radius: 9999px;
            background-color: #1b4e88;
            opacity: 0.2;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-hidden">
<!-- Main Splash Screen Container (iPhone 15 Pro Frame Aspect Ratio simulation) -->
<div class="relative flex flex-col items-center justify-center min-h-screen w-full bg-gradient-to-b from-white via-white to-blue-50 dark:from-background-dark dark:to-slate-900 px-8">
<!-- Status Bar Simulation Area (Top Space) -->
<div class="absolute top-0 w-full h-12 flex justify-center items-end pb-2">
<!-- Dynamic Island Spacer -->
<div class="w-32 h-9 bg-black rounded-full hidden md:block"></div>
</div>
<!-- Center Brand Identity Block -->
<div class="flex flex-col items-center gap-6">
<!-- Logo Composition -->
<div class="relative w-40 h-40 flex items-center justify-center">
<!-- Heart Shape (Navy) -->
<div class="absolute inset-0 flex items-center justify-center text-brand-navy">
<span class="material-symbols-outlined !text-[120px]" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">
                        favorite
                    </span>
</div>
<!-- Test Tube (Teal) -->
<div class="absolute inset-0 flex items-center justify-center translate-x-2 -translate-y-1 text-brand-teal">
<span class="material-symbols-outlined !text-[64px]" style="font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 48;">experiment</span>
<!-- Blood Drop (Red) inside tube area - simplified position -->
<div class="absolute translate-y-1 text-brand-red">
<span class="material-symbols-outlined !text-[18px]" style="font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 20;">
                            water_drop
                        </span>
</div>
</div>
<!-- Checkmark (Green) at the bottom -->
<div class="absolute bottom-2 bg-white dark:bg-slate-800 rounded-full p-1 shadow-sm border border-emerald-100 dark:border-emerald-900/30">
<span class="material-symbols-outlined text-emerald-500 !text-[24px] font-bold">
                        check_circle
                    </span>
</div>
</div>
<!-- Typography Block -->
<div class="text-center mt-2">
<h1 class="text-4xl font-black tracking-tight flex flex-col sm:flex-row items-center justify-center gap-0 sm:gap-2">
<span class="text-brand-navy">PRICK</span>
<span class="text-brand-teal">&amp; CARE</span>
</h1>
<p class="text-brand-navy/60 dark:text-slate-400 text-sm font-medium tracking-[0.2em] mt-4 uppercase">
                    Phlebotomy Operations
                </p>
</div>
</div>
<!-- Loading Indicator Area (Bottom) -->
<div class="absolute bottom-20 flex flex-col items-center gap-6">
<!-- Pulse Animation -->
<div class="relative pulse-circle flex items-center justify-center">
<div class="w-6 h-6 bg-primary rounded-full shadow-lg shadow-primary/30"></div>
</div>
<!-- Asset Loading Status Text -->
<div class="flex flex-col items-center gap-2">
<p class="text-slate-400 dark:text-slate-500 text-xs font-medium">Initializing secure connection...</p>
<div class="w-48 h-1 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-brand-teal w-1/3 rounded-full"></div>
</div>
</div>
</div>
<!-- Decorative Subtle Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] dark:opacity-[0.05]" data-alt="Subtle dot pattern medical aesthetic background" style="background-image: radial-gradient(#1b4e88 0.5px, transparent 0.5px); background-size: 24px 24px;">
</div>
<!-- iOS Home Indicator -->
<div class="absolute bottom-2 w-32 h-1 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
</div>
</body></html>

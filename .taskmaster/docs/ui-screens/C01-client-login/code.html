<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2ead7c",
                        "background-light": "#f6f8f7",
                        "background-dark": "#131f1a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Client Portal Login - Prick &amp; Care</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center">
<!-- Background Gradient Overlay -->
<div class="fixed inset-0 bg-gradient-to-br from-blue-50 via-white to-emerald-50 dark:from-background-dark dark:via-slate-900 dark:to-background-dark -z-10"></div>
<div class="w-full max-w-[480px] px-6 py-8 flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-8 flex flex-col items-center">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 mb-4">
<span class="material-symbols-outlined text-white text-4xl">colorize</span>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Prick &amp; Care</h1>
</div>
<!-- Login Card -->
<div class="w-full bg-white dark:bg-slate-800/50 backdrop-blur-sm rounded-xl border border-slate-200 dark:border-slate-700 shadow-xl p-8">
<div class="text-center mb-8">
<h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">Client Portal</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Sign in to manage your phlebotomy services</p>
</div>
<form class="space-y-5">
<!-- Email Input -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-background-light dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-slate-900 dark:text-slate-100" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-background-light dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-slate-900 dark:text-slate-100" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-md shadow-primary/20 transition-all active:scale-[0.98] mt-4" type="submit">
                    Sign In
                </button>
</form>
<!-- Registration Link -->
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700 text-center">
<p class="text-slate-600 dark:text-slate-400 text-sm">
                    New client?
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Register here</a>
</p>
</div>
</div>
<!-- Footer Decoration / Info -->
<div class="mt-12 text-center">
<div class="flex items-center justify-center gap-6 mb-4">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-slate-400 text-2xl mb-1">security</span>
<span class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Secure</span>
</div>
<div class="h-8 w-[1px] bg-slate-200 dark:bg-slate-700"></div>
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-slate-400 text-2xl mb-1">verified_user</span>
<span class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">HIPAA Compliant</span>
</div>
</div>
<p class="text-slate-400 dark:text-slate-500 text-[11px] leading-relaxed">
                © 2024 Prick &amp; Care Management Solutions. <br/>
                Protected by 256-bit SSL encryption.
            </p>
</div>
</div>
<!-- Background Decoration Image -->
<div class="fixed bottom-0 right-0 p-8 opacity-10 dark:opacity-5 pointer-events-none">
<div class="w-64 h-64 bg-primary/20 rounded-full blur-3xl"></div>
</div>
<div class="fixed top-0 left-0 p-8 opacity-10 dark:opacity-5 pointer-events-none">
<div class="w-96 h-96 bg-blue-400/20 rounded-full blur-3xl"></div>
</div>
</body></html>

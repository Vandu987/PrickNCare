name: prickncare_mobile
description: PricknCare Phlebotomist App - Blood Sample Collection Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP & Networking
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^15.1.2

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Biometric Authentication
  local_auth: ^2.3.0

  # Camera & Media
  image_picker: ^1.1.2

  # Signature
  signature: ^5.5.0

  # Push Notifications
  firebase_messaging: ^15.1.6
  firebase_core: ^3.8.1

  # Code Generation - Data classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Connectivity
  connectivity_plus: ^6.1.1

  # Utilities
  intl: ^0.20.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  riverpod_generator: ^2.6.3

  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
